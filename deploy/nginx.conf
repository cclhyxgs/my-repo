# ============================================================
# M-Bull H5 —— nginx（骨架期）
# ============================================================
# §2.13-3 硬约束：SSE 必须关闭 proxy_buffering，否则事件流被中间层缓冲，
# 进度成批到达或超时（app-architecture §6.2 R-12）。
# 应用侧同时下发 `X-Accel-Buffering: no`（server/core/sse.py），双向兜底。
# ============================================================
worker_processes 1;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # 普通接口/静态资源允许压缩；SSE 分区另行显式 gzip off
    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    upstream mbull_api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ---- SSE 长连接分区（绝对不可缓冲、不可压缩）----
        # 骨架期为内部探针；F-403/F-502/F-703 接入后此处承载业务事件流。
        location /api/_probe/ {
            proxy_pass http://mbull_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_buffering off;          # §2.13-3 硬约束
            proxy_cache off;
            proxy_read_timeout 3600s;     # 长连接：任务可能持续数小时（F-701）
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;

            add_header X-Accel-Buffering no always;
            add_header Cache-Control "no-cache, no-transform" always;
            gzip off;
        }

        # ---- 业务 API（C3 §3.2）----
        location /api/ {
            proxy_pass http://mbull_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        # ---- H5 静态产物（本次未产出，留位）----
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
}

# 生产加固（可选，与 MBULL_ENABLE_INTERNAL_PROBE=0 双保险）：
#   在 server{} 内把上面 /api/_probe/ 区块替换为 `return 404;` 即可从网关侧彻底屏蔽。
#   本次不默认启用，因 T7 需要 dev 态端到端验收。
